version: v2
managed:
  enabled: true
plugins:
  # Go generation. Plugin tags are pinned: a floating tag makes local
  # `make proto` output differ from CI, which uses buf 1.55.1.
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: gen/go
    opt:
      - paths=source_relative

  # Python is NOT generated here on purpose. buf's remote
  # `protocolbuffers/python` plugin tracks protobuf 7.x and emits a
  # runtime-version guard that the lockfile-pinned runtime (protobuf
  # 6.33.x, required by temporalio 1.21.1) cannot load. `make proto-python`
  # generates it with the lockfile-pinned grpcio-tools protoc instead.
