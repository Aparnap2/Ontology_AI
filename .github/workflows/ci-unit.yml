# .github/workflows/ci-unit.yml
# Unit tests — no external services needed
# Runs on push to main/dev/feature/** and PRs to main/dev/feature/**
#
# Coverage is intentionally NOT measured in this job: a tests/unit/ scope
# measured 42%, while the documented coverage scope is the full suite
# (AGENTS.md, docs/TESTING_ARCHITECTURE.md:580). The --cov-fail-under=70
# gate lives in ci.yml over tests/ — see that workflow for the known-red
# exception recorded for this release.

name: Unit Tests

on:
  push:
    branches: ["main", "dev", "feature/**", "fix/**"]
  pull_request:
    branches: ["main", "dev", "feature/**"]

jobs:
  unit-tests:
    name: Unit Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: apps/ai
        # pytest-cov lives in the dev extra; without it --cov* flags fail with
        # "unrecognized arguments" (exit 4). Install the extra for this job.
        run: uv sync --frozen --extra dev

      - name: Run unit tests (no services needed)
        working-directory: apps/ai
        env:
          DEMO_MODE: "true"
          LLM_PROVIDER: "mock"
          QDRANT_URL: "http://localhost:6333"     # not used — mocked
          POSTGRES_DSN: "postgresql://mock/mock"  # not used — mocked
        run: |
          uv run --frozen pytest tests/unit/ \
            -v \
            --tb=short \
            --timeout=30 \
            -n auto \
            --junitxml=reports/unit-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: apps/ai/reports/
          retention-days: 7

      - name: Publish test collection summary
        if: always()
        run: |
          echo "## Unit test collection" >> $GITHUB_STEP_SUMMARY
          cd apps/ai && uv run --frozen python -m pytest tests/unit/ --co -q 2>/dev/null | tail -5 >> $GITHUB_STEP_SUMMARY || true
