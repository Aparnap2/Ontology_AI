name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go tests (go 1.24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Verify queue contract constant exists
        run: |
          grep -q 'ONTOLOGYAI_MAIN_QUEUE = "ONTOLOGYAI-MAIN-QUEUE"' apps/core/internal/temporal/client.go \
            || { echo "::error::ONTOLOGYAI_MAIN_QUEUE constant missing in Go temporal client"; exit 1; }

      - name: Go build
        working-directory: apps/core
        run: go build ./...

      - name: Go test
        working-directory: apps/core
        run: go test ./...

  python:
    name: Python tests (3.13)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iterateswarm
          POSTGRES_PASSWORD: iterateswarm
          POSTGRES_DB: iterateswarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iterateswarm -d iterateswarm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Verify queue contract constant exists
        run: |
          grep -q 'ONTOLOGYAI_MAIN_QUEUE = "ONTOLOGYAI-MAIN-QUEUE"' apps/ai/src/orchestration/queue.py \
            || { echo "::error::ONTOLOGYAI_MAIN_QUEUE constant missing in Python queue module"; exit 1; }

      - name: Install dependencies (dev extra for pytest-cov)
        working-directory: apps/ai
        # pytest-cov lives in the dev extra; without it --cov* flags fail with
        # "unrecognized arguments" (exit 4). Same pattern as ci-unit.yml.
        run: uv sync --frozen --extra dev

      - name: Python tests
        working-directory: apps/ai
        env:
          TEST_DATABASE_URL: postgresql://iterateswarm:iterateswarm@localhost:5432/iterateswarm_test
        run: |
          # Onboarding restructure: src/agents/tools mesh removed (empty dir) so these
          # two e2e modules fail collection with ModuleNotFoundError; test_scheduler
          # needs a Postgres service + apscheduler and is covered by the integration
          # job, not this service-less broad run. Exclude exactly these modules.
          #
          # Coverage is measured over the documented full-suite scope (AGENTS.md,
          # docs/TESTING_ARCHITECTURE.md:580: `pytest tests/ --cov=src`), NOT the
          # unit-only scope (which measured 42%). Threshold retained at 70% per the
          # release-closeout decision; current full-suite measurement is ~64%, so
          # this gate is a DOCUMENTED KNOWN-RED exception for this release — it is
          # not claimed to pass. Threshold recalibration requires a separate,
          # explicitly approved policy change.
          uv run pytest tests/ -q \
            --ignore=tests/test_agentic_e2e_decisions.py \
            --ignore=tests/test_agentic_e2e_edge_cases.py \
            --ignore=tests/test_scheduler.py \
            --cov=src \
            --cov-report=term \
            --cov-fail-under=70
